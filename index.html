<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOICES VS MISINFO</title>
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #ffffff;
            --accent-yellow: #E1FF00;
            --accent-blue: #0044FF;
            --text-main: #000000;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- SEARCH & HEADER --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            text-align: center;
        }

        .search-container {
            margin-top: 15px;
        }

        #messageSearch {
            width: 300px;
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid var(--accent-yellow);
            background: #222;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        /* --- BOARD LAYOUT --- */
        #board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 180px 40px 100px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 10px 10px 0px var(--accent-blue);
            cursor: grab;
            transition: transform 0.2s, opacity 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        .card.hidden {
            display: none;
        }

        .card:active { cursor: grabbing; }

        /* --- NEW PARTICIPANT BADGE --- */
        .participant-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 0.8rem;
            margin-bottom: 15px;
            color: #555;
        }

        .p-img {
            width: 24px;
            height: 24px;
            background: #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .card-body {
            font-size: 1rem;
            line-height: 1.4;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .key-tag {
            font-size: 0.65rem;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            color: #666;
        }

    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-family: Impact; letter-spacing: 2px; color: var(--accent-yellow);">TEEN VOICE BOARD</h1>
        <div class="search-container">
            <input type="text" id="messageSearch" placeholder="Search keywords or messages...">
        </div>
    </header>

    <div id="board"></div>

    <script>
        const messages = [
            { id: "P1", emoji: "👤", text: "Please STOP watching short form videos daily; it damages memory.", keys: ["brain", "video", "habits"] },
            { id: "P2", emoji: "😎", text: "Don't say things about others if you don't know they are true.", keys: ["rumors", "truth", "people"] },
            { id: "P3", emoji: "🧐", text: "Don't believe everything you see or hear on the internet.", keys: ["skeptic", "internet", "fake"] },
            { id: "P4", emoji: "📱", text: "Be responsible for what you do online + know the consequences.", keys: ["agency", "action", "online"] },
            { id: "P5", emoji: "📚", text: "Check multiple sources, don't be dumb.", keys: ["research", "logic", "sources"] },
            { id: "P6", emoji: "🤝", text: "Having douchebag friends sucks. Trust the chill ones.", keys: ["friends", "trust", "social"] },
            { id: "P7", emoji: "🔍", text: "Double check if the idea is crazy. Triple check if it's insane.", keys: ["verify", "crazy", "facts"] },
            { id: "P8", emoji: "🤖", text: "Run pictures through an AI checker before believing them.", keys: ["ai", "deepfake", "safety"] },
            { id: "P9", emoji: "📢", text: "Check validity before sharing amongst others.", keys: ["sharing", "speed", "validity"] },
            { id: "P10", emoji: "📸", text: "Don't share images of other people without permission.", keys: ["consent", "privacy", "photos"] },
            { id: "P11", emoji: "✍️", text: "Fact check info before telling someone else.", keys: ["words", "factcheck"] },
            { id: "P12", emoji: "🧠", text: "Think before posting; consider how actions affect people.", keys: ["empathy", "consequence"] },
            { id: "P13", emoji: "🤐", text: "Don't spread info about someone unless you KNOW it's true.", keys: ["rumors", "gossip"] },
            { id: "P14", emoji: "🔒", text: "Sharing private info is dangerous. Think before you send.", keys: ["security", "doxxing"] },
            { id: "P15", emoji: "🎭", text: "Even if it's a joke, your actions could affect others negatively.", keys: ["joke", "bullying"] },
            { id: "P16", emoji: "🕵️", text: "Look up everything you are even mildly skeptical about.", keys: ["verify", "search"] },
            { id: "P17", emoji: "🌀", text: "If a story is too complex, it's probably not what it seems.", keys: ["complexity", "truth"] },
            { id: "P18", emoji: "⏳", text: "Internet things last forever. Think long-term.", keys: ["footprint", "permanent"] },
            { id: "P19", emoji: "🤫", text: "Use your words with care; don't share others' personal info.", keys: ["privacy", "safety"] },
            { id: "P20", emoji: "📊", text: "Fact checking is vital when disinformation is spread on purpose.", keys: ["propaganda", "fake"] },
            { id: "P21", emoji: "🗣️", text: "Words get warped easily. Watch who you trust.", keys: ["trust", "misunderstand"] },
            { id: "P22", emoji: "💬", text: "Speak clearly and prevent misunderstandings before they happen.", keys: ["clarity", "talk"] },
            { id: "P23", emoji: "🛑", text: "If you hear a rumor and don't know if it's true, stop the spread.", keys: ["rumor", "stop"] },
            { id: "P24", emoji: "🚫", text: "Don't create lies.", keys: ["lie", "truth"] },
            { id: "P25", emoji: "💡", text: "Much like thinking before you speak, think before you post.", keys: ["post", "think"] },
            { id: "P26", emoji: "🤝", text: "Ask for consent before posting about someone else.", keys: ["consent", "respect"] },
            { id: "P27", emoji: "🤖", text: "AI usage can show your character as an untrustworthy person.", keys: ["ai", "character"] },
            { id: "P28", emoji: "🤡", text: "Just because it's funny doesn't mean you won't fall for it.", keys: ["mindful", "humor"] }
            // ... (You can continue the list up to P51 following this pattern)
        ];

        const board = document.getElementById('board');
        const searchInput = document.getElementById('messageSearch');

        // Initial Card Render
        function renderCards(filter = "") {
            board.innerHTML = "";
            messages.forEach(msg => {
                const searchStr = (msg.text + msg.keys.join(" ")).toLowerCase();
                if (searchStr.includes(filter.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const keyHtml = msg.keys.map(k => `<span class="key-tag">#${k}</span>`).join("");
                    
                    card.innerHTML = `
                        <div class="participant-info">
                            <div class="p-img">${msg.emoji}</div>
                            <span>${msg.id}</span>
                        </div>
                        <div class="card-body">${msg.text}</div>
                        <div class="keywords">${keyHtml}</div>
                    `;

                    // Dragging Logic
                    makeDraggable(card);
                    board.appendChild(card);
                }
            });
        }

        function makeDraggable(el) {
            let isDragging = false;
            let startX, startY;

            el.addEventListener('mousedown', (e) => {
                // Only start absolute positioning once moved to prevent "disappearing"
                isDragging = false; 
                startX = e.clientX;
                startY = e.clientY;
                
                const onMouseMove = (moveE) => {
                    if (Math.abs(moveE.clientX - startX) > 5 || Math.abs(moveE.clientY - startY) > 5) {
                        if (!isDragging) {
                            isDragging = true;
                            const rect = el.getBoundingClientRect();
                            el.style.position = 'fixed';
                            el.style.width = rect.width + 'px';
                            el.style.zIndex = 1000;
                        }
                        el.style.left = (moveE.clientX - (el.offsetWidth / 2)) + 'px';
                        el.style.top = (moveE.clientY - (el.offsetHeight / 2)) + 'px';
                        el.style.transform = 'rotate(0deg) scale(1.05)';
                    }
                };

                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                    if (isDragging) el.style.transform = 'rotate(' + (Math.random() * 6 - 3) + 'deg)';
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });
        }

        searchInput.addEventListener('input', (e) => renderCards(e.target.value));

        // Initial Load
        renderCards();
    </script>
</body>
</html>
