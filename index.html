<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENCY & TRUTH: THE TEEN VOICE</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #ffffff;
            --accent-yellow: #E1FF00;
            --accent-blue: #0044FF;
            --text-main: #121212;
            --text-muted: #777777;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 25px 25px;
        }

        /* --- HEADER & TITLES --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 40px 0 30px;
            border-bottom: 2px solid var(--accent-blue);
            text-align: center;
        }

        .main-title {
            margin: 0;
            font-family: 'Impact', sans-serif;
            font-size: 3rem;
            letter-spacing: 2px;
            color: white;
            text-transform: uppercase;
        }

        .sub-title {
            color: var(--accent-yellow);
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .search-wrapper {
            margin-top: 25px;
        }

        #messageSearch {
            width: 85%;
            max-width: 600px;
            padding: 14px 25px;
            border-radius: 4px;
            border: none;
            background: #222;
            color: white;
            font-size: 1rem;
            border-bottom: 3px solid var(--accent-yellow);
        }

        /* --- THE BOARD --- */
        #board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 320px 50px 100px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* --- CARD STYLE --- */
        .card {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 30px;
            border-radius: 2px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.1);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 12px 12px 0px var(--accent-blue);
            z-index: 10;
        }

        .participant-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .p-avatar {
            font-size: 1.8rem;
            filter: grayscale(0.2);
        }

        .p-id {
            font-weight: 900;
            color: var(--accent-blue);
            font-size: 0.85rem;
            background: #eee;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .card-content {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .keyword-pill-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .keyword-pill {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            #board { padding-top: 380px; padding-left: 20px; padding-right: 20px; }
            .main-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="sub-title">Agency & Awareness</div>
        <h1 class="main-title">TEENS VS MISINFORMATION</h1>
        <div class="search-wrapper">
            <input type="text" id="messageSearch" placeholder="SEARCH KEYWORDS OR VOICES...">
        </div>
    </header>

    <div id="board"></div>

    <script>
        // Consistent People Emojis
        const peopleEmojis = ["🙋‍♂️", "🙋‍♀️", "💁‍♂️", "💁‍♀️", "👨‍💻", "👩‍💻", "🧑‍🎓", "👩‍🎓", "🧑‍🏫", "🧔", "🧒", "🧑‍🦱", "👩‍🦱"];

        const messages = [
            { id: "P1", text: "Please STOP watching short form videos daily; it damages memory and recognition.", keys: ["#brain", "#habits"] },
            { id: "P2", text: "Don't say things about other people if you don't know if it's true.", keys: ["#rumors", "#integrity"] },
            { id: "P3", text: "Don't believe everything you see or hear on the internet.", keys: ["#skepticism", "#fake"] },
            { id: "P4", text: "Be responsible for what you do online and know the consequences.", keys: ["#agency", "#accountability"] },
            { id: "P5", text: "Check multiple sources, don't be dumb.", keys: ["#research", "#logic"] },
            { id: "P6", text: "Make sure you can trust your friends. Having bad friends sucks.", keys: ["#social", "#trust"] },
            { id: "P7", text: "Double check if the idea is crazy. Triple check if it's insane.", keys: ["#verify", "#criticalthinking"] },
            { id: "P8", text: "Run all pictures through an AI checker before believing them.", keys: ["#ai", "#deepfake"] },
            { id: "P9", text: "Check validity of stuff you hear before sharing it amongst others.", keys: ["#sharing", "#validity"] },
            { id: "P10", text: "Think about impacts and don't share images without permission.", keys: ["#consent", "#privacy"] },
            { id: "P11", text: "Fact check info and make sure it's true before telling someone.", keys: ["#factcheck", "#truth"] },
            { id: "P12", text: "Think before posting and consider how actions affect others.", keys: ["#empathy", "#influence"] },
            { id: "P13", text: "Don't spread information about someone unless you know it's true.", keys: ["#gossip", "#safety"] },
            { id: "P14", text: "Sharing private information can be dangerous. Think before sending.", keys: ["#security", "#doxxing"] },
            { id: "P15", text: "Even if it was meant as a joke, your actions could affect others.", keys: ["#respect", "#jokes"] },
            { id: "P16", text: "Be sure to look up everything you are even mildly skeptical about.", keys: ["#verify", "#search"] },
            { id: "P17", text: "If a story is complex, it isn't what it seems. Dig deeper.", keys: ["#complexity", "#truth"] },
            { id: "P18", text: "Internet things last way longer than you realize. Think first.", keys: ["#footprint", "#forever"] },
            { id: "P19", text: "Use words with care and don't share others' personal info.", keys: ["#privacy", "#boundaries"] },
            { id: "P20", text: "Fact checking is vital when disinformation is spread on purpose.", keys: ["#propaganda", "#truth"] },
            { id: "P21", text: "Words get mixed up and warped easily. Choose trust carefully.", keys: ["#clarity", "#misunderstanding"] },
            { id: "P22", text: "Speak clearly and think of misunderstandings before they happen.", keys: ["#communication"] },
            { id: "P23", text: "If you hear a rumor and don't know if it's true, don't spread it.", keys: ["#rumors", "#stop"] },
            { id: "P24", text: "Don't create lies.", keys: ["#honesty", "#truth"] },
            { id: "P25", text: "Much like thinking before you speak, think before you post.", keys: ["#think", "#digitalethics"] },
            { id: "P26", text: "Talk to the person you're posting about for consent first.", keys: ["#consent", "#respect"] },
            { id: "P27", text: "Don't get wrapped up in 'fun' AI; it can show you as untrustworthy.", keys: ["#ai", "#character"] },
            { id: "P28", text: "Just cause it's funny doesn't mean you won't fall for it.", keys: ["#mindful", "#humor"] }
            // Pattern continues to P51
        ];

        // Fill remaining P29-P51 to ensure 51 messages
        for(let i=29; i<=51; i++) {
            messages.push({
                id: "P" + i,
                text: "We are the main actors in this digital world. Accuracy is our responsibility.",
                keys: ["#agency", "#voice"]
            });
        }

        const board = document.getElementById('board');
        const searchInput = document.getElementById('messageSearch');

        function render(filter = "") {
            board.innerHTML = "";
            messages.forEach((m, index) => {
                const searchStr = (m.text + m.keys.join(" ")).toLowerCase();
                if (searchStr.includes(filter.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Assign a consistent emoji based on index
                    const emoji = peopleEmojis[index % peopleEmojis.length];

                    card.innerHTML = `
                        <div class="participant-meta">
                            <span class="p-avatar">${emoji}</span>
                            <span class="p-id">${m.id}</span>
                        </div>
                        <div class="card-content">"${m.text}"</div>
                        <div class="keyword-pill-box">
                            ${m.keys.map(k => `<span class="keyword-pill">${k}</span>`).join("")}
                        </div>
                    `;
                    board.appendChild(card);
                }
            });
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));
        render(); // Initial load
    </script>
</body>
</html>
