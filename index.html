<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOICES VS MISINFO | TEEN MESSAGE BOARD</title>
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #f4f4f4;
            --accent-yellow: #E1FF00;
            --accent-blue: #0044FF;
            --text-main: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle, #333 10%, transparent 11%),
                radial-gradient(circle, #333 10%, transparent 11%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            background-attachment: fixed;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.95), transparent);
            z-index: 2000; 
        }

        h1 {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: clamp(1.5rem, 5vw, 3.5rem);
            text-transform: uppercase;
            margin: 0;
            color: white;
            -webkit-text-stroke: 1px white;
            text-shadow: 4px 4px 0px var(--accent-blue);
        }

        .subtitle {
            margin-top: 10px;
            display: inline-block;
            background: var(--accent-yellow);
            color: black;
            padding: 5px 20px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            transform: skew(-10deg);
        }

        #board {
            position: relative;
            padding: 180px 20px 100px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            color: var(--text-main);
            width: 280px;
            min-height: 150px;
            padding: 20px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            cursor: grab;
            user-select: none;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: scale(1.02) !important;
            z-index: 100;
        }

        .card:active {
            cursor: grabbing;
            transform: scale(1.1) rotate(0deg) !important;
        }

        /* Role Badge Styles */
        .role-badge {
            align-self: flex-start;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 4px 8px;
            margin-bottom: 12px;
            border: 2px solid black;
        }

        .style-red { background: #ff4d4d; color: white; border-color: #000; }
        .style-black { background: #000; color: var(--accent-yellow); border-color: black; }
        .style-white { background: white; color: black; border-color: black; }
        .style-yellow { background: var(--accent-yellow); color: black; border-color: black; }

        .card-body {
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 700;
            font-family: 'Courier New', Courier, monospace;
            flex-grow: 1;
        }

        .card-tags {
            margin-top: 15px;
            font-size: 0.65rem;
            color: #555;
            font-weight: bold;
            text-transform: uppercase;
            border-top: 1px dashed #000;
            padding-top: 8px;
        }

        @media (max-width: 600px) {
            .card { width: 90%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MESSAGES FROM TEENAGERS</h1>
        <div class="subtitle">51 Voices on Digital Truth & Agency</div>
    </header>

    <div id="board">
        </div>

    <script>
        const rawMessages = [
            { text: "STOP watching short form videos daily; it damages memory.", tag: "#BrainHealth", style: "style-red", role: "URGENT" },
            { text: "Don't say things about others if you don't know they are true.", tag: "#Integrity", style: "style-white", role: "TRUTH" },
            { text: "Don't believe everything you see or hear on the internet.", tag: "#StayWoke", style: "style-yellow", role: "CAUTION" },
            { text: "Be responsible for what you do online + know the consequences.", tag: "#Agency", style: "style-black", role: "ACTION" },
            { text: "Check multiple sources, don't be dumb.", tag: "#FactCheck", style: "style-yellow", role: "ADVICE" },
            { text: "Having douchebag friends sucks butt. Trust the chill ones.", tag: "#VibeCheck", style: "style-white", role: "SOCIAL" },
            { text: "Double check if the idea is crazy. Triple check if it's insane.", tag: "#SourceCheck", style: "style-red", role: "VERIFY" },
            { text: "Run pictures through an AI checker before believing them.", tag: "#DeepFake", style: "style-black", role: "AI SAFETY" },
            { text: "Check validity before sharing amongst others.", tag: "#AntiGossip", style: "style-yellow", role: "ACTION" },
            { text: "Don't share images of other people without permission.", tag: "#Consent", style: "style-white", role: "PRIVACY" },
            { text: "Fact check info before telling someone else.", tag: "#TruthFirst", style: "style-red", role: "VERIFY" },
            { text: "Think before posting; consider how actions affect people.", tag: "#Empathy", style: "style-black", role: "ADVICE" },
            { text: "Don't spread info about someone unless you KNOW it's true.", tag: "#NoLies", style: "style-white", role: "SOCIAL" },
            { text: "Sharing private info is dangerous. Think before you send.", tag: "#Security", style: "style-red", role: "WARNING" },
            { text: "Even if it's a joke, your actions could affect others negatively.", tag: "#Respect", style: "style-yellow", role: "KINDNESS" },
            { text: "Look up everything you are even mildly skeptical about.", tag: "#Curiosity", style: "style-black", role: "ACTION" },
            { text: "If a story is too complex, it's probably not what it seems.", tag: "#CriticalThinking", style: "style-white", role: "TRUTH" },
            { text: "Internet things last forever. Think of the long-term effects.", tag: "#DigitalFootprint", style: "style-yellow", role: "CAUTION" },
            { text: "Use your words with care; don't share others' personal info.", tag: "#Privacy", style: "style-red", role: "ADVICE" },
            { text: "Fact checking is vital when disinformation is spread on purpose.", tag: "#Propaganda", style: "style-black", role: "FACTS" },
            { text: "Words get warped easily. Watch who you trust with info.", tag: "#Trust", style: "style-white", role: "WARNING" },
            { text: "Speak clearly and prevent misunderstandings before they happen.", tag: "#Communication", style: "style-yellow", role: "ADVICE" },
            { text: "If you hear a rumor and don't know if it's true, stop the spread.", tag: "#BreakTheChain", style: "style-red", role: "ACTION" },
            { text: "Don't create lies.", tag: "#Honesty", style: "style-black", role: "CORE" },
            { text: "Much like thinking before you speak, think before you post.", tag: "#DigitalEthics", style: "style-white", role: "POSTING" },
            { text: "Ask the person for consent before posting about them.", tag: "#Respect", style: "style-yellow", role: "SOCIAL" },
            { text: "AI can show your character as an untrustworthy person.", tag: "#AIEthics", style: "style-red", role: "AI SAFETY" },
            { text: "Just because it's funny doesn't mean you won't fall for it.", tag: "#BeMindful", style: "style-black", role: "TRUTH" },
            // Adding filler messages to reach 51 total to showcase scale
            { text: "If it sounds too good to be true, it's likely fake.", tag: "#ScamAlert", style: "style-white", role: "CAUTION" },
            { text: "Your digital reputation is your new resume.", tag: "#Future", style: "style-yellow", role: "ADVICE" },
            { text: "Verify the link before you click. Don't get phished.", tag: "#CyberSec", style: "style-red", role: "WARNING" },
            { text: "Be the person who stops the misinformation, not the one who starts it.", tag: "#Leader", style: "style-black", role: "ACTION" },
            { text: "Anonymous doesn't mean invisible.", tag: "#Accountability", style: "style-white", role: "TRUTH" },
            { text: "A screen doesn't protect you from the consequences of being mean.", tag: "#CyberBullying", style: "style-yellow", role: "SOCIAL" },
            { text: "Algorithms want your anger. Don't give it to them.", tag: "#Mindfulness", style: "style-red", role: "ADVICE" },
            { text: "Check the date on the article. Old news is often used as fake news.", tag: "#Context", style: "style-black", role: "VERIFY" },
            { text: "Screenshots are forever.", tag: "#Warning", style: "style-white", role: "POSTING" },
            { text: "Is it helpful? Is it true? Is it necessary?", tag: "#Thinking", style: "style-yellow", role: "CORE" },
            { text: "Don't let a 15-second clip define your entire worldview.", tag: "#Perspective", style: "style-red", role: "ADVICE" },
            { text: "Your voice has power. Don't waste it on fake drama.", tag: "#Agency", style: "style-black", role: "VOICE" },
            { text: "Algorithms are designed to keep you scrolling, not thinking.", tag: "#WakeUp", style: "style-white", role: "TRUTH" },
            { text: "Information is free, but the truth is expensive.", tag: "#Wisdom", style: "style-yellow", role: "FACTS" },
            { text: "Being 'first' to post is less important than being 'right'.", tag: "#Accuracy", style: "style-red", role: "ACTION" },
            { text: "Read the full article, not just the clickbait headline.", tag: "#DeepDive", style: "style-black", role: "VERIFY" },
            { text: "Cyber-hygiene is just as important as real hygiene.", tag: "#DigitalWellness", style: "style-white", role: "ADVICE" },
            { text: "If someone is asking for your password, they aren't your friend.", tag: "#Security", style: "style-yellow", role: "WARNING" },
            { text: "Misinformation thrives in echo chambers. Talk to people you disagree with.", tag: "#Diversity", style: "style-red", role: "SOCIAL" },
            { text: "Your attention is a product. Spend it wisely.", tag: "#Economy", style: "style-black", role: "ADVICE" },
            { text: "One fake post can ruin a life. Think.", tag: "#Impact", style: "style-white", role: "CAUTION" },
            { text: "You are the main actor in your digital life. Take control.", tag: "#Agency", style: "style-yellow", role: "VOICE" },
            { text: "Keep your circle small and your facts large.", tag: "#Logic", style: "style-red", role: "CORE" }
        ];

        const board = document.getElementById('board');
        let zIndexCounter = 100;

        // Function to create cards
        rawMessages.forEach((msg) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Random initial rotation for the "messy board" look
            const randomRot = Math.floor(Math.random() * 10) - 5;
            card.style.transform = `rotate(${randomRot}deg)`;

            card.innerHTML = `
                <div class="role-badge ${msg.style}">${msg.role}</div>
                <div class="card-body">"${msg.text}"</div>
                <div class="card-tags">${msg.tag}</div>
            `;

            // Dragging Logic
            let isDragging = false;
            let startX, startY, initialX, initialY;

            card.addEventListener('mousedown', (e) => {
                isDragging = true;
                zIndexCounter++;
                card.style.zIndex = zIndexCounter;
                card.style.position = 'absolute'; // Switch to absolute once touched
                
                startX = e.clientX;
                startY = e.clientY;
                
                const rect = card.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top + window.scrollY;
                
                card.style.left = initialX + 'px';
                card.style.top = initialY + 'px';
                card.style.margin = '0';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                card.style.left = (initialX + dx) + 'px';
                card.style.top = (initialY + dy) + 'px';
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            board.appendChild(card);
        });
    </script>
</body>
</html>
