<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENCY & TRUTH: THE TEEN VOICE</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #ffffff;
            --accent-yellow: #E1FF00;
            --accent-blue: #0044FF;
            --text-main: #121212;
            --text-muted: #777777;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 25px 25px;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 40px 0 30px;
            border-bottom: 2px solid var(--accent-blue);
            text-align: center;
        }

        .sub-title {
            color: var(--accent-yellow);
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .main-title {
            margin: 0;
            font-family: 'Impact', sans-serif;
            font-size: clamp(1.5rem, 5vw, 3rem);
            letter-spacing: 2px;
            color: white;
            text-transform: uppercase;
        }

        .search-wrapper {
            margin-top: 25px;
        }

        #messageSearch {
            width: 85%;
            max-width: 600px;
            padding: 14px 25px;
            border-radius: 4px;
            border: none;
            background: #222;
            color: white;
            font-size: 1rem;
            border-bottom: 3px solid var(--accent-yellow);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 340px 50px 100px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 30px;
            border-radius: 2px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.1);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 12px 12px 0px var(--accent-blue);
            z-index: 10;
        }

        .participant-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .p-avatar {
            font-size: 1.8rem;
        }

        .p-id {
            font-weight: 900;
            color: var(--accent-blue);
            font-size: 0.85rem;
            background: #eee;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .card-content {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        @media (max-width: 600px) {
            #board { padding-top: 400px; padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="sub-title">Agency & Awareness</div>
        <h1 class="main-title">TEENS & MISINFORMATION</h1>
        <div class="search-wrapper">
            <input type="text" id="messageSearch" placeholder="SEARCH MESSAGES OR VOICES...">
        </div>
    </header>

    <div id="board"></div>

    <script>
        const peopleEmojis = ["🙋‍♂️", "🙋‍♀️", "💁‍♂️", "💁‍♀️", "👨‍💻", "👩‍💻", "🧑‍🎓", "👩‍🎓", "🧑‍🏫", "🧔", "🧑‍🦱", "👩‍🦱"];

        const rawMessages = [
            "Please STOP watching short form videos on the daily, it can greatly damage memory and recognition.",
            "Don't say things about other people if you don't know if it's true",
            "Don't believe everything you see/hear on the internet",
            "Be responsible for what you do on the internet + know the consequences of your actions",
            "Check multiple sources, don't be dumb",
            "Make sure you can trust your friends and that you are all chill with each other. Having douchebag friends sucks butt.",
            "Check the source. Double check if the idea is crazy. Triple check if it's actually insane. Maybe even a quadruple check if yes?",
            "Run all pictures and videos through an AI checker before believing it's real or positng about it",
            "Check validity of stuff you hear or see before sharing it amongst others",
            "Think about the impacts your actions have on the people around you and don't share images of other people without permission",
            "Fact check information and make sure it's actually true before telling someone else",
            "I would tell them to not trust everything they see. I would tell them to think before posting and consider how their actions might affect other people.",
            "Don't spread information about someone online unless you know it's true.",
            "Sharing private information can be dangerous so you should think before you send.",
            "Think about your actions, even if it was meant as a joke your actions could affect others negatively",
            "Be sure to look up everything you are even mildly skeptical about",
            "It doesn't matter what story of thing is online, it matters that if it's complex, then the story isn't what it is.",
            "Things on the intenret can last way longer and have way bigger effects than you realize. Before you post something, you should think about the effects it'll have on other people.",
            "Use your words with care and don't share others' personal info without consent or at all. It's not your information to share",
            "I think fact checking is very imporatnt in this day and age with disinformation spread on purpose.",
            "Words often get mixed up and warped easily so be careful who you choose to trust with harmful info.",
            "Speak clearly and think of misunderstandings before they come about.",
            "If you hear a rumor and you don't know if it's true or not, don't spread it further.",
            "Don't create lies",
            "Much like thinking before you speak, think before you post. Your actions have big consequences and once it's online it's there forever.",
            "Make sure that you are talking to the person that you are making misinformation about for consent or do research first",
            "Don't get wrapped up in the \"fun\" of things like AI, because they can have consequences and it can show your character as an untrustworthy person.",
            "Just cause its funny and obvious to you does not mean you will not fall for it, be mindful",
            "Think about everyone before you post. People have different reactions and boundaries",
            "Doubt information before you get concrete evidence (Something more than a single picture or one person's view)",
            "Always question things that you aren't 100% certain on.",
            "Always don't trust the info unless you know them in person or know for sure that they are trustworthy through other people.",
            "Don't be dumb",
            "Think about it. Is it true/false. Is it safe/harmful. Is it helpful/worse. Is it right/wrong. Is it good/bad.",
            "If you produced some misinformation unintentionally, just keep it for yourself, don't share or show it to anyone else.",
            "Even if you think you are right, and you trust the other, always keep things to yourself. Sharing opinions will always face someone who opposes to it. If you keep it to yourself no conflict will occur. So, keep it to yourself.",
            "Do not share information if you know that it's not true.",
            "Don't hangout with people who make you a victim and don't spread rumors you don't know is true",
            "Only spread the info if you know for 100% that it's true",
            "Never make a assumption if you saw real situation",
            "Don't spread rumors before knowing if the information or story are true and confirmed. (Anna would do this)",
            "I would not gossip.",
            "To the middle schoolers—don't trust everything that people say, misinformation can be formed from the wrong motivations.",
            "Don't trust everything online! Check out a reliable source you can find.",
            "Validate your sources/have a bit of doubt on others' words",
            "AI is NOT your friend",
            "Don't believe everything you see online and ask trusted adults if you are unsure.",
            "One piece of advice I'd give is to not trust everything blindly. Always verify your information before spreading it.",
            "If you see misinformation, make sure not to send it to friends without telling them it's false. Always ensure people are aware of the truthfulness of information",
            "Research before you share anything and post/repost responsibly about news, especially political or social issues!! Try to fact check by looking at comments and Google.",
            "Don't let your emotions control you because that'll lead to faster spread of misinfo and you'll probably make it worse",
            "Be careful who you share things to also you should check the victim beforehand.",
            "Misinformation can spiral and share very quickly since it is usually shocking. Be careful when you are sharing sketchy posts with people.",
            "Think & Analyze for a little before sharing or believing.",
            "Misinformation can be harmful to everyone invalued & it can spread very quickly. You shouldn’t create it or spread it as once you do, you can’t undo it.",
            "Reflect on emotions and acknowledge what I feel so I know what/how to act like.",
            "Think before you act",
            "Check info before spreading it around",
            "Be sure to think of others too, rather than just yourself."
        ];

        const board = document.getElementById('board');
        const searchInput = document.getElementById('messageSearch');

        function render(filter = "") {
            board.innerHTML = "";
            rawMessages.forEach((text, index) => {
                if (text.toLowerCase().includes(filter.toLowerCase())) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const emoji = peopleEmojis[index % peopleEmojis.length];
                    const participantId = "P" + (index + 1);

                    card.innerHTML = `
                        <div class="participant-meta">
                            <span class="p-avatar">${emoji}</span>
                            <span class="p-id">${participantId}</span>
                        </div>
                        <div class="card-content">"${text}"</div>
                    `;
                    board.appendChild(card);
                }
            });
        }

        searchInput.addEventListener('input', (e) => render(e.target.value));
        render(); // Initial load
    </script>
</body>
</html>
